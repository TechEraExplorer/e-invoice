<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FatturaPA E-Invoicing Flow | Interactive Architecture</title>
  <style>
    :root {
      --bg-canvas: #090d16;
      --bg-surface: #111827;
      --bg-surface-hover: #182235;
      --bg-active: #0c2d48;
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-hover: rgba(148, 163, 184, 0.32);
      --border-active: #38bdf8;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-accent: #bae6fd;
      --accent-glow: rgba(56, 189, 248, 0.16);
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 55%),
        radial-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 1160px;
    }

    /* Header & Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--border-active);
      margin-bottom: 0.45rem;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--border-active);
      box-shadow: 0 0 8px var(--border-active);
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.92rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(30, 41, 59, 0.6);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.5rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn-ghost:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
    }

    .btn-ghost.playing {
      border-color: var(--border-active);
      color: var(--border-active);
      background: rgba(56, 189, 248, 0.1);
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(148, 163, 184, 0.12);
      border-radius: 999px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Horizontal Pipeline */
    .pipeline {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: space-between;
      gap: 0.45rem;
      overflow-x: auto;
      padding: 0.35rem 0.1rem 1rem;
    }

    .step-node {
      flex: 1 1 190px;
      min-width: 185px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 1.1rem 1rem;
      text-align: left;
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .step-node:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .step-node.completed {
      border-color: rgba(56, 189, 248, 0.28);
    }

    .step-node.active {
      background: linear-gradient(165deg, rgba(14, 58, 92, 0.92), rgba(12, 45, 72, 0.95));
      border: 1.5px solid var(--border-active);
      box-shadow: 0 8px 28px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .node-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .step-badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
    }

    .step-node.completed .step-badge {
      color: #7dd3fc;
    }

    .step-node.active .step-badge {
      color: var(--border-active);
    }

    .node-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all 0.18s ease;
    }

    .step-node.active .node-icon {
      background: rgba(56, 189, 248, 0.18);
      color: var(--border-active);
    }

    .step-title {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .step-summary {
      font-size: 0.8rem;
      line-height: 1.42;
      color: var(--text-secondary);
    }

    .step-node.active .step-summary {
      color: var(--text-accent);
    }

    /* Animated Connector Arrows */
    .connector {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      flex-shrink: 0;
      padding: 0 0.05rem;
      transition: color 0.25s ease;
    }

    .connector.lit {
      color: var(--border-active);
    }

    .connector svg {
      width: 20px;
      height: 20px;
    }

    /* Detail Inspector Panel */
    .inspector {
      margin-top: 0.65rem;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 1.6rem 1.75rem;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 1.75rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      animation: fadeSlide 0.22s ease-out;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0.65;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .inspector-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }

    .inspector-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--border-active);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .inspector-main p {
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.62;
      margin-bottom: 1.15rem;
    }

    .meta-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 0.6rem;
    }

    .meta-list li {
      background: rgba(9, 13, 22, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.55rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .meta-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.82rem;
      color: var(--text-accent);
      font-weight: 500;
    }

    /* Code Box with Header & Copy */
    .code-wrapper {
      background: #070b12;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.9rem;
      background: rgba(30, 41, 59, 0.45);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.74rem;
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .copy-btn.copied {
      color: var(--success);
      border-color: rgba(52, 211, 153, 0.4);
    }

    .inspector-code {
      padding: 0.95rem 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.79rem;
      line-height: 1.55;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre;
    }

    /* Syntax Highlights */
    .tok-tag { color: #38bdf8; }
    .tok-key { color: #7dd3fc; }
    .tok-str { color: #34d399; }
    .tok-num { color: #fbbf24; }

    /* Footer Controls */
    .controls {
      margin-top: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .kbd-hint {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    kbd {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 0.1rem 0.42rem;
      font-family: inherit;
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    .nav-btns {
      display: flex;
      gap: 0.5rem;
    }

    button.nav-btn {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 0.48rem 0.95rem;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.nav-btn:hover:not(:disabled) {
      border-color: var(--border-active);
      color: var(--border-active);
      background: var(--bg-surface-hover);
    }

    button.nav-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    @media (max-width: 860px) {
      .inspector {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="eyebrow"><span class="eyebrow-dot"></span> Architecture Walkthrough</div>
        <h1>Italian E-Invoicing Flow (FatturaPA)</h1>
        <p class="subtitle">Select any stage to inspect schema transformations, SdI clearance rules, and archiving compliance.</p>
      </div>
      <div class="header-actions">
        <button class="btn-ghost" id="autoPlayBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Auto-Play Flow</span>
        </button>
      </div>
    </div>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progressFill" style="width: 20%;"></div>
    </div>

    <div class="pipeline" id="pipeline" role="tablist" aria-label="FatturaPA Process Steps"></div>

    <section class="inspector" id="inspector" aria-live="polite"></section>

    <div class="controls">
      <div class="kbd-hint">
        <span>Navigate with</span> <kbd>←</kbd> <kbd>→</kbd> <span>or click any stage card</span>
      </div>
      <div class="nav-btns">
        <button class="nav-btn" id="prevBtn" type="button">← Previous</button>
        <button class="nav-btn" id="nextBtn" type="button">Next →</button>
      </div>
    </div>
  </div>

  <script>
    const icons = {
      erp: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>`,
      transform: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>`,
      clearance: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>`,
      delivery: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`,
      archive: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`
    };

    const steps = [
      {
        id: 1,
        icon: icons.erp,
        title: "1. Extraction",
        shortDesc: "Customer ERP generates custom format",
        tag: "Source System",
        fileLabel: "erp-export.json",
        detail: "The supplier's ERP system extracts invoice header, line items, tax rates, and customer master data into its native export format (IDoc, JSON, CSV, or proprietary XML) and transmits it securely to Pagero.",
        specs: [
          { label: "Protocol", value: "SFTP / REST API" },
          { label: "Input Format", value: "ERP Native (IDoc / JSON)" },
          { label: "Trigger", value: "Invoice Posting Event" }
        ],
        sample: `{
  "invoiceNumber": "INV-2026-0841",
  "issueDate": "2026-11-11",
  "currency": "EUR",
  "vatRate": 22.0,
  "totalAmount": 1220.00
}`
      },
      {
        id: 2,
        icon: icons.transform,
        title: "2. Transformation",
        shortDesc: "Pagero maps to FatturaPA XML",
        tag: "Core Mapping",
        fileLabel: "IT01234567890_00001.xml",
        detail: "Pagero normalises the raw ERP payload, enriches missing Italian fiscal codes (Natura IVA, TipoDocumento), applies a qualified digital signature (CAdES-BES / XAdES), and outputs schema-valid FatturaPA v1.2 XML.",
        specs: [
          { label: "Standard", value: "FatturaPA XML v1.2" },
          { label: "Signature", value: "XAdES-BES / CAdES" },
          { label: "Pre-Check", value: "XSD & Business Rules" }
        ],
        sample: `<FatturaElettronicaHeader>
  <DatiTrasmissione>
    <FormatoTrasmissione>FPR12</FormatoTrasmissione>
    <CodiceDestinatario>SUBM70N</CodiceDestinatario>
  </DatiTrasmissione>
</FatturaElettronicaHeader>`
      },
      {
        id: 3,
        icon: icons.clearance,
        title: "3. Clearance",
        shortDesc: "Pagero sends XML to SdI for validation",
        tag: "Tax Authority",
        fileLabel: "RC_9841204912.xml",
        detail: "Pagero submits the signed XML to Italy's Sistema di Interscambio (SdI). SdI verifies fiscal integrity, VAT numbers, and uniqueness before issuing either a Delivery Receipt (Ricevuta di Consegna) or Rejection Notice (Notifica di Scarto).",
        specs: [
          { label: "Gateway", value: "Sistema di Interscambio (SdI)" },
          { label: "Response Window", value: "Real-time up to 5 days" },
          { label: "Outcome", value: "Ricevuta di Consegna (RC)" }
        ],
        sample: `<RicevutaConsegna>
  <IdentificativoSdI>9841204912</IdentificativoSdI>
  <DataOraRicezione>2026-11-11T21:54:10Z</DataOraRicezione>
  <Esito>EC01 - Accepted</Esito>
</RicevutaConsegna>`
      },
      {
        id: 4,
        icon: icons.delivery,
        title: "4. Delivery",
        shortDesc: "SdI routes to buyer via Codice Destinatario",
        tag: "Buyer Routing",
        fileLabel: "sdi-routing.log",
        detail: "Once cleared, SdI automatically routes the official invoice to the buyer's registered channel using their 7-character Codice Destinatario or certified PEC email address, while Pagero syncs status updates back to the seller's ERP.",
        specs: [
          { label: "Primary Channel", value: "7-char Codice Destinatario" },
          { label: "Fallback", value: "Certified PEC Email" },
          { label: "ERP Sync", value: "Status Webhook / Ack" }
        ],
        sample: `{
  "codiceDestinatario": "SUBM70N",
  "channel": "Accredited SdI Endpoint",
  "deliveryStatus": "DELIVERED",
  "erpSync": "SUCCESS"
}`
      },
      {
        id: 5,
        icon: icons.archive,
        title: "5. Archiving",
        shortDesc: "10-year legal storage (Conservazione)",
        tag: "Compliance",
        fileLabel: "PdV-2026-0841.manifest",
        detail: "Both the signed FatturaPA XML and all SdI clearance receipts are sealed into compliant Italian digital archiving (Conservazione Sostitutiva) with qualified timestamps for the mandatory 10-year retention period.",
        specs: [
          { label: "Retention Period", value: "10 Years Mandatory" },
          { label: "Framework", value: "AgID Conservazione" },
          { label: "Integrity", value: "SHA-256 + Qualified Timestamp" }
        ],
        sample: `{
  "archivePackage": "PdV-2026-0841.zip",
  "digestAlgorithm": "SHA-256",
  "retentionYears": 10,
  "validUntil": "2036-11-11"
}`
      }
    ];

    let activeIndex = 0;
    let autoPlayTimer = null;

    const pipelineEl = document.getElementById("pipeline");
    const inspectorEl = document.getElementById("inspector");
    const progressFill = document.getElementById("progressFill");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const autoPlayBtn = document.getElementById("autoPlayBtn");

    function highlightSyntax(raw) {
      const escaped = raw
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      return escaped
        .replace(/(&lt;\/?[a-zA-Z0-9_:-]+&gt;)/g, '<span class="tok-tag">$1</span>')
        .replace(/("[^"]+")(\s*:)/g, '<span class="tok-key">$1</span>$2')
        .replace(/(:\s*)("[^"]*")/g, '$1<span class="tok-str">$2</span>')
        .replace(/(:\s*)(\d+(\.\d+)?)/g, '$1<span class="tok-num">$2</span>');
    }

    function render() {
      const pct = ((activeIndex + 1) / steps.length) * 100;
      progressFill.style.width = `${pct}%`;

      pipelineEl.innerHTML = steps
        .map((step, idx) => {
          const isActive = idx === activeIndex;
          const isCompleted = idx < activeIndex;
          const arrowHtml =
            idx < steps.length - 1
              ? `<div class="connector ${idx < activeIndex ? "lit" : ""}" aria-hidden="true">
                   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                     <line x1="5" y1="12" x2="19" y2="12"></line>
                     <polyline points="12 5 19 12 12 19"></polyline>
                   </svg>
                 </div>`
              : "";

          return `
            <button
              type="button"
              class="step-node ${isActive ? "active" : ""} ${isCompleted ? "completed" : ""}"
              role="tab"
              aria-selected="${isActive}"
              onclick="handleUserSelect(${idx})"
            >
              <div class="node-top">
                <span class="step-badge">Stage 0${step.id}</span>
                <span class="node-icon">${step.icon}</span>
              </div>
              <span class="step-title">${step.title}</span>
              <span class="step-summary">${step.shortDesc}</span>
            </button>
            ${arrowHtml}
          `;
        })
        .join("");

      const current = steps[activeIndex];
      inspectorEl.innerHTML = `
        <div class="inspector-main">
          <div class="inspector-header">
            <h2>${current.title}</h2>
            <span class="pill">${current.tag}</span>
          </div>
          <p>${current.detail}</p>
          <ul class="meta-list">
            ${current.specs
              .map(
                (spec) => `
              <li>
                <span class="meta-label">${spec.label}</span>
                <span class="meta-value">${spec.value}</span>
              </li>`
              )
              .join("")}
          </ul>
        </div>
        <div class="code-wrapper">
          <div class="code-header">
            <span>${current.fileLabel}</span>
            <button type="button" class="copy-btn" id="copyPayloadBtn" onclick="copyPayload()">Copy</button>
          </div>
          <div class="inspector-code" aria-label="Sample Payload">${highlightSyntax(current.sample)}</div>
        </div>
      `;

      prevBtn.disabled = activeIndex === 0;
      nextBtn.disabled = activeIndex === steps.length - 1;
    }

    function selectStep(index) {
      activeIndex = index;
      render();
    }

    function handleUserSelect(index) {
      stopAutoPlay();
      selectStep(index);
    }

    function copyPayload() {
      const current = steps[activeIndex];
      navigator.clipboard.writeText(current.sample).then(() => {
        const btn = document.getElementById("copyPayloadBtn");
        if (btn) {
          btn.textContent = "Copied!";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "Copy";
            btn.classList.remove("copied");
          }, 1600);
        }
      });
    }

    function stopAutoPlay() {
      if (autoPlayTimer) {
        clearInterval(autoPlayTimer);
        autoPlayTimer = null;
        autoPlayBtn.classList.remove("playing");
        autoPlayBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Auto-Play Flow</span>
        `;
      }
    }

    function toggleAutoPlay() {
      if (autoPlayTimer) {
        stopAutoPlay();
        return;
      }
      autoPlayBtn.classList.add("playing");
      autoPlayBtn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        <span>Pause Tour</span>
      `;
      autoPlayTimer = setInterval(() => {
        const next = (activeIndex + 1) % steps.length;
        selectStep(next);
      }, 3200);
    }

    autoPlayBtn.addEventListener("click", toggleAutoPlay);

    prevBtn.addEventListener("click", () => {
      stopAutoPlay();
      if (activeIndex > 0) selectStep(activeIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      stopAutoPlay();
      if (activeIndex < steps.length - 1) selectStep(activeIndex + 1);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" && activeIndex > 0) {
        stopAutoPlay();
        selectStep(activeIndex - 1);
      }
      if (e.key === "ArrowRight" && activeIndex < steps.length - 1) {
        stopAutoPlay();
        selectStep(activeIndex + 1);
      }
    });

    render();
  </script>
</body>
</html>
