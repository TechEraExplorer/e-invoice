<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FatturaPA E-Invoicing Flow | Interactive Architecture</title>
  <style>
    :root {
      --bg-canvas: #090d16;
      --bg-surface: #111827;
      --bg-surface-hover: #182235;
      --bg-active: #0c2d48;
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-hover: rgba(148, 163, 184, 0.32);
      --border-active: #38bdf8;
      --border-error: #f87171;
      --bg-error: #3b1219;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-accent: #bae6fd;
      --text-error-accent: #fecaca;
      --accent-glow: rgba(56, 189, 248, 0.16);
      --error-glow: rgba(248, 113, 113, 0.18);
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 55%),
        radial-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    body.error-mode {
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(248, 113, 113, 0.09) 0%, transparent 55%),
        radial-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px);
    }

    .container {
      width: 100%;
      max-width: 1180px;
    }

    /* Header & Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--border-active);
      margin-bottom: 0.45rem;
      transition: color 0.2s ease;
    }

    body.error-mode .eyebrow {
      color: var(--border-error);
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--border-active);
      box-shadow: 0 0 8px var(--border-active);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    body.error-mode .eyebrow-dot {
      background-color: var(--border-error);
      box-shadow: 0 0 8px var(--border-error);
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.92rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    /* Scenario Toggle Segmented Control */
    .scenario-switch {
      display: inline-flex;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .scenario-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.42rem 0.8rem;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .scenario-btn:hover {
      color: var(--text-primary);
    }

    .scenario-btn.active-happy {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.35);
    }

    .scenario-btn.active-error {
      background: rgba(248, 113, 113, 0.16);
      color: #f87171;
      box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.38);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(30, 41, 59, 0.6);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.48rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn-ghost:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
    }

    .btn-ghost.playing {
      border-color: var(--border-active);
      color: var(--border-active);
      background: rgba(56, 189, 248, 0.1);
    }

    body.error-mode .btn-ghost.playing {
      border-color: var(--border-error);
      color: var(--border-error);
      background: rgba(248, 113, 113, 0.1);
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(148, 163, 184, 0.12);
      border-radius: 999px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
    }

    body.error-mode .progress-fill {
      background: linear-gradient(90deg, #dc2626, #f87171);
    }

    /* Horizontal Pipeline */
    .pipeline {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: space-between;
      gap: 0.25rem;
      overflow-x: auto;
      padding: 0.35rem 0.1rem 1rem;
    }

    .step-node {
      flex: 1 1 185px;
      min-width: 180px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 1.05rem 0.95rem;
      text-align: left;
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .step-node:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .step-node.completed {
      border-color: rgba(56, 189, 248, 0.28);
    }

    body.error-mode .step-node.completed {
      border-color: rgba(248, 113, 113, 0.28);
    }

    .step-node.active {
      background: linear-gradient(165deg, rgba(14, 58, 92, 0.92), rgba(12, 45, 72, 0.95));
      border: 1.5px solid var(--border-active);
      box-shadow: 0 8px 28px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .step-node.error-node.active {
      background: linear-gradient(165deg, rgba(69, 18, 27, 0.94), rgba(48, 12, 19, 0.96));
      border: 1.5px solid var(--border-error);
      box-shadow: 0 8px 28px var(--error-glow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .step-node.error-node:not(.active) {
      border-color: rgba(248, 113, 113, 0.25);
    }

    .node-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .step-badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
    }

    .step-node.completed .step-badge {
      color: #7dd3fc;
    }

    body.error-mode .step-node.completed .step-badge {
      color: #fca5a5;
    }

    .step-node.active .step-badge {
      color: var(--border-active);
    }

    .step-node.error-node.active .step-badge {
      color: var(--border-error);
    }

    .node-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all 0.18s ease;
    }

    .step-node.active .node-icon {
      background: rgba(56, 189, 248, 0.18);
      color: var(--border-active);
    }

    .step-node.error-node.active .node-icon {
      background: rgba(248, 113, 113, 0.18);
      color: var(--border-error);
    }

    .step-title {
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .step-summary {
      font-size: 0.79rem;
      line-height: 1.4;
      color: var(--text-secondary);
    }

    .step-node.active .step-summary {
      color: var(--text-accent);
    }

    .step-node.error-node.active .step-summary {
      color: var(--text-error-accent);
    }

    /* Flowing Dotted Line Connector Arrows */
    .connector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 34px;
      position: relative;
    }

    .connector-dir-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
      opacity: 0.85;
    }

    .connector.reverse .connector-dir-label {
      color: #f87171;
    }

    .connector svg {
      width: 34px;
      height: 18px;
      overflow: visible;
    }

    .flow-line {
      stroke: #475569;
      stroke-width: 2;
      stroke-dasharray: 3.5 3.5;
      stroke-linecap: round;
      animation: flowForward 0.85s linear infinite;
      transition: stroke 0.25s ease;
    }

    .flow-head {
      stroke: #475569;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.25s ease;
    }

    /* Lit / Active Forward Flow */
    .connector.lit .flow-line,
    .connector.lit .flow-head {
      stroke: #38bdf8;
    }

    /* Error / Reverse Flow */
    body.error-mode .connector.lit .flow-line,
    body.error-mode .connector.lit .flow-head {
      stroke: #f87171;
    }

    .connector.reverse .flow-line {
      stroke: #f87171;
      animation: flowBackward 0.85s linear infinite;
    }

    .connector.reverse .flow-head {
      stroke: #f87171;
    }

    @keyframes flowForward {
      from {
        stroke-dashoffset: 14;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes flowBackward {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: 14;
      }
    }

    /* Detail Inspector Panel */
    .inspector {
      margin-top: 0.65rem;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 1.6rem 1.75rem;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 1.75rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      animation: fadeSlide 0.22s ease-out;
    }

    .inspector.error-panel {
      border-color: rgba(248, 113, 113, 0.28);
    }

    @keyframes fadeSlide {
      from {
        opacity: 0.65;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .inspector-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }

    .inspector-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--border-active);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .pill.error-pill {
      background: rgba(248, 113, 113, 0.14);
      color: var(--border-error);
      border: 1px solid rgba(248, 113, 113, 0.35);
    }

    .inspector-main p {
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.62;
      margin-bottom: 1.15rem;
    }

    .meta-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 0.6rem;
    }

    .meta-list li {
      background: rgba(9, 13, 22, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.55rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .meta-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .meta-value {
      font-size: 0.82rem;
      color: var(--text-accent);
      font-weight: 500;
    }

    .inspector.error-panel .meta-value {
      color: var(--text-error-accent);
    }

    /* Code Box with Header & Copy */
    .code-wrapper {
      background: #070b12;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.9rem;
      background: rgba(30, 41, 59, 0.45);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.74rem;
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .copy-btn.copied {
      color: var(--success);
      border-color: rgba(52, 211, 153, 0.4);
    }

    .inspector-code {
      padding: 0.95rem 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.79rem;
      line-height: 1.55;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre;
    }

    /* Syntax Highlights */
    .tok-tag { color: #38bdf8; }
    .tok-err { color: #f87171; font-weight: 600; }
    .tok-key { color: #7dd3fc; }
    .tok-str { color: #34d399; }
    .tok-num { color: #fbbf24; }

    /* Footer Controls */
    .controls {
      margin-top: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .kbd-hint {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    kbd {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 0.1rem 0.42rem;
      font-family: inherit;
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    .nav-btns {
      display: flex;
      gap: 0.5rem;
    }

    button.nav-btn {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 0.48rem 0.95rem;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.nav-btn:hover:not(:disabled) {
      border-color: var(--border-active);
      color: var(--border-active);
      background: var(--bg-surface-hover);
    }

    body.error-mode button.nav-btn:hover:not(:disabled) {
      border-color: var(--border-error);
      color: var(--border-error);
    }

    button.nav-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    @media (max-width: 860px) {
      .inspector {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="eyebrow"><span class="eyebrow-dot"></span> <span id="eyebrowText">Standard Clearance Flow</span></div>
        <h1>Italian E-Invoicing Flow (FatturaPA)</h1>
        <p class="subtitle" id="subtitleText">Select any stage or toggle scenarios to inspect schema transformations, SdI clearance, and rejection handling.</p>
      </div>
      <div class="header-actions">
        <div class="scenario-switch" role="group" aria-label="Flow Scenario">
          <button type="button" class="scenario-btn active-happy" id="btnHappy">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Cleared (EC01)
          </button>
          <button type="button" class="scenario-btn" id="btnError">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            SdI Rejection (Scarto)
          </button>
        </div>

        <button class="btn-ghost" id="autoPlayBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Auto-Play Flow</span>
        </button>
      </div>
    </div>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progressFill" style="width: 20%;"></div>
    </div>

    <div class="pipeline" id="pipeline" role="tablist" aria-label="FatturaPA Process Steps"></div>

    <section class="inspector" id="inspector" aria-live="polite"></section>

    <div class="controls">
      <div class="kbd-hint">
        <span>Navigate with</span> <kbd>←</kbd> <kbd>→</kbd> <span>or click any stage card</span>
      </div>
      <div class="nav-btns">
        <button class="nav-btn" id="prevBtn" type="button">← Previous</button>
        <button class="nav-btn" id="nextBtn" type="button">Next →</button>
      </div>
    </div>
  </div>

  <script>
    const icons = {
      erp: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>`,
      transform: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>`,
      clearance: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>`,
      delivery: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`,
      archive: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`,
      alert: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`,
      undo: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>`
    };

    const scenarios = {
      happy: {
        eyebrow: "Standard Clearance Flow (Happy Path)",
        subtitle: "Select any stage or switch to SdI Rejection to inspect schema transformations, clearance, and archiving.",
        steps: [
          {
            id: 1,
            icon: icons.erp,
            title: "1. Extraction",
            shortDesc: "Customer ERP generates custom format",
            tag: "Source System",
            fileLabel: "erp-export.json",
            isError: false,
            connectorDir: "forward",
            detail: "The supplier's ERP system extracts invoice header, line items, tax rates, and customer master data into its native export format (IDoc, JSON, CSV, or proprietary XML) and transmits it securely to Pagero.",
            specs: [
              { label: "Protocol", value: "SFTP / REST API" },
              { label: "Input Format", value: "ERP Native (IDoc / JSON)" },
              { label: "Trigger", value: "Invoice Posting Event" }
            ],
            sample: `{

    let currentScenario = "happy";
    let activeIndex = 0;
    let autoPlayTimer = null;

    const pipelineEl = document.getElementById("pipeline");
    const inspectorEl = document.getElementById("inspector");
    const progressFill = document.getElementById("progressFill");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const autoPlayBtn = document.getElementById("autoPlayBtn");
    const btnHappy = document.getElementById("btnHappy");
    const btnError = document.getElementById("btnError");
    const eyebrowText = document.getElementById("eyebrowText");
    const subtitleText = document.getElementById("subtitleText");

    function highlightSyntax(raw) {
      const escaped = raw
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      return escaped
        .replace(/(&lt;\/?(?:NotificaScarto|ListaErrori|Errore|Codice|Descrizione)&gt;)/g, '<span class="tok-err">$1</span>')
        .replace(/(&lt;\/?[a-zA-Z0-9_:-]+&gt;)/g, '<span class="tok-tag">$1</span>')
        .replace(/("[^"]+")(\s*:)/g, '<span class="tok-key">$1</span>$2')
        .replace(/(:\s*)("[^"]*")/g, '$1<span class="tok-str">$2</span>')
        .replace(/(:\s*)(\d+(\.\d+)?)/g, '$1<span class="tok-num">$2</span>');
    }

    function buildArrowSvg(direction) {
      if (direction === "reverse") {
        // Left-pointing flowing dotted arrow (return path)
        return `
          <span class="connector-dir-label">Return</span>
          <svg viewBox="0 0 36 18" aria-hidden="true">
            <line class="flow-line" x1="3" y1="9" x2="33" y2="9"></line>
            <polyline class="flow-head" points="9 4 3 9 9 14"></polyline>
          </svg>
        `;
      }
      // Right-pointing flowing dotted arrow (forward path)
      return `
        <svg viewBox="0 0 36 18" aria-hidden="true">
          <line class="flow-line" x1="3" y1="9" x2="33" y2="9"></line>
          <polyline class="flow-head" points="27 4 33 9 27 14"></polyline>
        </svg>
      `;
    }

    function render() {
      const data = scenarios[currentScenario];
      const steps = data.steps;

      document.body.classList.toggle("error-mode", currentScenario === "error");
      eyebrowText.textContent = data.eyebrow;
      subtitleText.textContent = data.subtitle;

      btnHappy.className = `scenario-btn ${currentScenario === "happy" ? "active-happy" : ""}`;
      btnError.className = `scenario-btn ${currentScenario === "error" ? "active-error" : ""}`;

      const pct = ((activeIndex + 1) / steps.length) * 100;
      progressFill.style.width = `${pct}%`;

      pipelineEl.innerHTML = steps
        .map((step, idx) => {
          const isActive = idx === activeIndex;
          const isCompleted = idx < activeIndex;
          const isErrorNode = step.isError;

          // Determine connector after this node
          let connectorHtml = "";
          if (idx < steps.length - 1) {
            const nextStep = steps[idx + 1];
            const dir = nextStep.connectorDir === "reverse" ? "reverse" : "forward";
            const isLit = idx < activeIndex || (dir === "reverse" && (idx === activeIndex || idx + 1 === activeIndex));

            connectorHtml = `
              <div class="connector ${isLit ? "lit" : ""} ${dir === "reverse" ? "reverse" : ""}" aria-hidden="true">
                ${buildArrowSvg(dir)}
              </div>
            `;
          }

          return `
            <button
              type="button"
              class="step-node ${isActive ? "active" : ""} ${isCompleted ? "completed" : ""} ${isErrorNode ? "error-node" : ""}"
              role="tab"
              aria-selected="${isActive}"
              onclick="handleUserSelect(${idx})"
            >
              <div class="node-top">
                <span class="step-badge">Stage 0${step.id}</span>
                <span class="node-icon">${step.icon}</span>
              </div>
              <span class="step-title">${step.title}</span>
              <span class="step-summary">${step.shortDesc}</span>
            </button>
            ${connectorHtml}
          `;
        })
        .join("");

      const current = steps[activeIndex];
      inspectorEl.className = `inspector ${current.isError ? "error-panel" : ""}`;
      inspectorEl.innerHTML = `
        <div class="inspector-main">
          <div class="inspector-header">
            <h2>${current.title}</h2>
            <span class="pill ${current.isError ? "error-pill" : ""}">${current.tag}</span>
          </div>
          <p>${current.detail}</p>
          <ul class="meta-list">
            ${current.specs
              .map(
                (spec) => `
              <li>
                <span class="meta-label">${spec.label}</span>
                <span class="meta-value">${spec.value}</span>
              </li>`
              )
              .join("")}
          </ul>
        </div>
        <div class="code-wrapper">
          <div class="code-header">
            <span>${current.fileLabel}</span>
            <button type="button" class="copy-btn" id="copyPayloadBtn" onclick="copyPayload()">Copy</button>
          </div>
          <div class="inspector-code" aria-label="Sample Payload">${highlightSyntax(current.sample)}</div>
        </div>
      `;

      prevBtn.disabled = activeIndex === 0;
      nextBtn.disabled = activeIndex === steps.length - 1;
    }

    function switchScenario(mode) {
      stopAutoPlay();
      currentScenario = mode;
      activeIndex = mode === "error" ? 2 : 0; // Jump directly to SdI Rejection when switching to error mode
      render();
    }

    function selectStep(index) {
      activeIndex = index;
      render();
    }

    function handleUserSelect(index) {
      stopAutoPlay();
      selectStep(index);
    }

    function copyPayload() {
      const current = scenarios[currentScenario].steps[activeIndex];
      navigator.clipboard.writeText(current.sample).then(() => {
        const btn = document.getElementById("copyPayloadBtn");
        if (btn) {
          btn.textContent = "Copied!";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "Copy";
            btn.classList.remove("copied");
          }, 1600);
        }
      });
    }

    function stopAutoPlay() {
      if (autoPlayTimer) {
        clearInterval(autoPlayTimer);
        autoPlayTimer = null;
        autoPlayBtn.classList.remove("playing");
        autoPlayBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Auto-Play Flow</span>
        `;
      }
    }

    function toggleAutoPlay() {
      if (autoPlayTimer) {
        stopAutoPlay();
        return;
      }
      autoPlayBtn.classList.add("playing");
      autoPlayBtn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        <span>Pause Tour</span>
      `;
      const totalSteps = scenarios[currentScenario].steps.length;
      autoPlayTimer = setInterval(() => {
        const next = (activeIndex + 1) % totalSteps;
        selectStep(next);
      }, 3200);
    }

    btnHappy.addEventListener("click", () => switchScenario("happy"));
    btnError.addEventListener("click", () => switchScenario("error"));
    autoPlayBtn.addEventListener("click", toggleAutoPlay);

    prevBtn.addEventListener("click", () => {
      stopAutoPlay();
      if (activeIndex > 0) selectStep(activeIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      stopAutoPlay();
      const totalSteps = scenarios[currentScenario].steps.length;
      if (activeIndex < totalSteps - 1) selectStep(activeIndex + 1);
    });

    document.addEventListener("keydown", (e) => {
      const totalSteps = scenarios[currentScenario].steps.length;
      if (e.key === "ArrowLeft" && activeIndex > 0) {
        stopAutoPlay();
        selectStep(activeIndex - 1);
      }
      if (e.key === "ArrowRight" && activeIndex < totalSteps - 1) {
        stopAutoPlay();
        selectStep(activeIndex + 1);
      }
    });

    render();
  </script>
